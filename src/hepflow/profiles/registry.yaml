registry:
  functions:
    sqrt: numpy:sqrt
    abs: numpy:abs
    log: numpy:log
    log10: numpy:log10
    exp: numpy:exp
    where: numpy:where
  constants: {}
  sources: {}
  transforms: {}
  observers: {}
  sinks: {}
  backends:
    local.default:
      impl: hepflow.backends:Local
  hooks: {}
  compile_hooks:
    flow.expand_field_glob:
      kind: parameter
      impl: hepflow.compiler.hooks.expand_field_glob:expand_field_glob
    flow.load_mapping:
      kind: parameter
      impl: hepflow.compiler.hooks.load_mapping:load_mapping
    flow.expand_mapping_matrix:
      kind: parameter
      impl: hepflow.compiler.hooks.expand_mapping_matrix:expand_mapping_matrix
