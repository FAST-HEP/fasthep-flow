# Temporary alpha workflow: installs the FAST-HEP dependencies from Git main because PyPI releases may
# lag during alpha. The logic is shared in FAST-HEP/.github (`enabled` there is the central off
# switch); once alpha CI is retired, delete this file.
name: Alpha CI

on:
  push:
  pull_request:

jobs:
  alpha-ci:
    uses: FAST-HEP/.github/.github/workflows/package-alpha-ci.yml@main
    with:
      extras: "test,distributed"
