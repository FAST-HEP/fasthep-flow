name: CD

on:
  workflow_dispatch:
  push:
    tags:
      - "20*.*.*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "3"

jobs:
  contract:
    name: Changelog contract
    uses: FAST-HEP/.github/.github/workflows/changelog-contract.yml@main

  dist:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.62.2
          cache: false

      - name: Build sdist and wheel
        run: pixi run build

      - name: Check distributions
        run: pixi run check-dist

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [dist, contract]
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/fasthep-flow

    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  release:
    name: GitHub release
    needs: [publish]
    permissions:
      contents: write
    uses: FAST-HEP/.github/.github/workflows/github-release.yml@main
    with:
      pypi-name: fasthep-flow
