name: CD

on:
  workflow_dispatch:
  push:
    tags:
      - "20*.*.*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "3"

jobs:
  contract:
    name: Changelog contract
    uses: FAST-HEP/.github/.github/workflows/changelog-contract.yml@main

  dist:
    name: Build distribution
    uses: FAST-HEP/.github/.github/workflows/build-dist.yml@main

  publish:
    name: Publish to PyPI
    needs: [dist, contract]
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/fasthep-flow

    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  release:
    name: GitHub release
    needs: [publish]
    permissions:
      contents: write
    uses: FAST-HEP/.github/.github/workflows/github-release.yml@main
    with:
      pypi-name: fasthep-flow
