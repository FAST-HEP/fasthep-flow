# The toy workflow. The ``toy_workflow`` fixture (tests/conftest.py) adds ``registry`` from
# tests/fixtures/toy_registry.yaml.
version: "1.0"

sources:
  events:
    kind: toy.source
    stream_type: event_stream

analysis:
  stages:
    - id: Scale
      op: toy.scale
      params:
        factor: 2
      write:
        - kind: toy.write
          path: output.json
          when: final
